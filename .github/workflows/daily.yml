name: Daily poll predictions

on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC = 10am Eastern
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install packages
        run: Rscript -e 'install.packages(c("readr","dplyr","purrr","stringr","lubridate","googlesheets4"))'

      - name: Write Google key
        run: printf '%s' "$GOOGLE_SERVICE_KEY" > key.json
        env:
          GOOGLE_SERVICE_KEY: ${{ secrets.GOOGLE_SERVICE_KEY }}

      - name: Run pipeline
        run: Rscript run_pipeline.R
        env:
          GS4_KEY: key.json
