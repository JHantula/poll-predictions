name: Daily poll predictions

on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC = 10am Eastern
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Install packages
        run: Rscript -e 'install.packages(c("readr","dplyr","purrr","stringr","lubridate","googlesheets4","curl"))'

      - name: Check packages
        run: Rscript -e 'library(curl); library(googlesheets4)'
        
      - name: Write Google key
        run: printf '%s' "$GOOGLE_SERVICE_KEY" > key.json
        env:
          GOOGLE_SERVICE_KEY: ${{ secrets.GOOGLE_SERVICE_KEY }}

      - name: Check key file
        run: |
          echo "key file size: $(wc -c < key.json) bytes"
          python3 -c "import json; d = json.load(open('key.json')); print(d['type'], d['client_email'])"

      - name: Run pipeline
        run: Rscript run_pipeline.R
        env:
          GS4_KEY: key.json
